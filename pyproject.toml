[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "my-ai-trading"
version = "0.2.0"
description = "Read-only, evidence-driven market research engine and Trading Copilot backend"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - no license chosen yet"}
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.120,<1", "uvicorn>=0.38,<1", "python-multipart>=0.0.20,<1"]
ai = ["anthropic>=1.0,<2"]
vision = ["opencv-python-headless>=4.10,<6"]
ml = ["scikit-learn>=1.6,<2", "lightgbm>=4.5,<5"]  # OCR also needs the system tesseract program
test = ["pytest>=9,<10", "hypothesis>=6.140,<7", "httpx2>=2.16,<3"]  # Starlette TestClient transport
# R8 exchange accounts: OS credential vault + exchange WebSocket streams (see docs/ACCOUNTS_TRADING.md)
accounts = ["keyring>=25.7,<26", "websockets>=17,<18"]
analytics = ["numpy>=2.2,<3", "pandas>=3,<4"]  # portfolio and performance analytics

[project.scripts]
my-ai-trading = "my_ai_trading.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["error"]
