[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "my-ai-trading"
version = "0.2.0"
description = "Read-only, evidence-driven market research engine and Trading Copilot backend"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - no license chosen yet"}
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.120,<1", "uvicorn>=0.38,<1", "python-multipart>=0.0.20,<1"]
ai = ["anthropic>=1.0,<2"]
test = ["pytest>=9,<10", "hypothesis>=6.140,<7", "httpx>=0.28,<1"]

[project.scripts]
my-ai-trading = "my_ai_trading.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = [
    "error",
    # Third-party: Starlette's TestClient warns about httpx; not our code.
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
]
