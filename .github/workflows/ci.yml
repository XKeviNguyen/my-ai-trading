name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (no AI extra; tests are offline)
        run: python -m pip install -e '.[api,test,vision,ml]'
      - name: Tests
        run: python -m pytest
      # Secret scanning in CI needs a full-history scanner (e.g. Gitleaks) — owner decision, see docs/SECURITY.md.
